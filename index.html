
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">

  <!-- Discourage search engine indexing -->
  <meta name="robots"
        content="noindex, nofollow, noarchive, noimageindex">
  <meta name="googlebot"
        content="noindex, nofollow, noimageindex">

  <title>Wedding Invitation</title>
  <meta name="description"
        content="A personal wedding invitation.">

  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="page">

    <header class="welcome">
      <p class="eyebrow">A SPECIAL INVITATION</p>
      <h1>You're Invited</h1>
      <p class="intro">
        We would be delighted to celebrate
        our special day with you.
      </p>
    </header>


<section class="invitation"
         aria-label="Our wedding invitation">

  <!-- Front of the invitation -->
  <div class="invitation-side">
    <img
      src="invitation-front.webp"
      alt="Front of our wedding invitation"
      class="invitation-image"
    >
  </div>

  <!-- Back of the invitation -->
  <div class="invitation-side">
    <img
      src="invitation-back.webp"
      alt="Wedding details and programme"
      class="invitation-image"
    >
  </div>

</section>


    <section class="actions">
      <p class="message">
        We hope you can join us!
        Please let us know by responding below.
      </p>

      <a
        href="https://withjoy.com/sookyung-and-paul/rsvp"
        class="button button-primary"
        target="_blank"
        rel="noopener noreferrer"
      >
        RSVP
      </a>

      <a
        href="https://withjoy.com/sookyung-and-paul/"
        class="button button-secondary"
        target="_blank"
        rel="noopener noreferrer"
      >
        Visit Our Wedding Website
      </a>
    </section>

    <footer>
      <p>With love ♡</p>
    </footer>

  </main>
</body>
</html>
